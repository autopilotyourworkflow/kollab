# Render blueprint: deploys the FastAPI judgment layer as a live backend.
# One-click from the Render dashboard (New > Blueprint > point at this repo).
# The Cloudflare Pages demo stays up regardless — it serves the committed
# pipeline output; set VITE_API_URL at Pages build time to point the UI here
# for live per-request compute.
services:
  - type: web
    name: kollab-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && pip install -e .[live]
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: KOLLAB_SOURCE
        value: apify           # LIVE public-data sourcing (APIFY_TOKEN required)
      - key: KOLLAB_RUN_BUDGET_USD
        value: "5"
      - key: KOLLAB_SHARED_KEY
        value: "1"             # share your keys as the fallback; set 0 to require
                              #  visitors' own keys (the "I'm running low" kill switch)
      - key: APIFY_TOKEN
        sync: false            # legacy single operator key — optional once the pool has keys
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false            # Neon pooled connection string — set in the dashboard
      # ── Apify key pool (auto-rotation) ──
      # Paste several free Apify account tokens in the app's Settings page; Kollab spends
      # the fattest healthy one and swaps automatically when it runs low. Two secrets lock
      # it down so only the operator can manage keys and the tokens are unreadable at rest:
      - key: KOLLAB_KEY_ENC_SECRET
        sync: false            # encrypts pool tokens at rest — any strong passphrase; NEVER commit
      - key: KOLLAB_ADMIN_SECRET
        sync: false            # the admin password that gates the pool manager in Settings
      - key: KOLLAB_KEY_REFRESH_MINUTES
        value: "20"            # how often the background refresher re-checks each key's balance
