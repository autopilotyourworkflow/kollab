# Render blueprint: deploys the FastAPI judgment layer as a live backend.
# One-click from the Render dashboard (New > Blueprint > point at this repo).
# The Cloudflare Pages demo stays up regardless — it serves the committed
# pipeline output; set VITE_API_URL at Pages build time to point the UI here
# for live per-request compute.
services:
  - type: web
    name: kollab-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && pip install -e .[live]
    # --proxy-headers + trusting the forwarding proxy makes request.client.host reflect the
    # real client (via X-Forwarded-For) behind Render's load balancer, so the per-IP auth
    # rate limiter buckets by actual client instead of lumping everyone under the proxy IP.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: KOLLAB_SOURCE
        value: apify           # LIVE public-data sourcing (APIFY_TOKEN required)
      - key: KOLLAB_RUN_BUDGET_USD
        value: "5"
      - key: KOLLAB_SHARED_KEY
        value: "1"             # share your keys as the fallback; set 0 to require
                              #  visitors' own keys (the "I'm running low" kill switch)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false            # Neon pooled connection string — set in the dashboard
      # ── Apify key pool (auto-rotation) ──
      # Set one or more Apify account tokens here; Kollab uses them in order and swaps to
      # the next automatically when one runs low or hits Apify's usage wall. Each free
      # Apify account carries $5/month — add as many as you want (APIFY_TOKEN_4, _5, ...).
      - key: APIFY_TOKEN_1
        sync: false            # set in the Render dashboard, never in the repo
      - key: APIFY_TOKEN_2
        sync: false
      - key: APIFY_TOKEN_3
        sync: false
      - key: APIFY_TOKEN
        sync: false            # legacy single key — still counted as one pool member if set
      - key: KOLLAB_KEY_REFRESH_MINUTES
        value: "20"            # how often the background refresher re-checks each key's balance
      - key: KOLLAB_KEY_MIN_USD
        value: "0.50"          # skip a key once its remaining monthly credit drops below this
