[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kollab-backend"
version = "0.3.0"
description = "Brand-fit + fraud-vetting judgment layer for Thai TikTok KOLs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Live paths (Apify sourcing, Claude/Gemini Brand DNA + rerank, site fetch) plus
# the durable Postgres store (SQLAlchemy + psycopg3). The credential-free demo
# needs none of these; all imports are lazy.
live = [
    "apify-client>=1.7",
    "anthropic>=0.40",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

# Ship only the app package (a flat layout with tests/ + eval/ alongside would
# otherwise make setuptools auto-discovery ambiguous and fail the build).
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # fastapi 0.139's TestClient shim warns about the upstream starlette
    # httpx -> httpx2 transition; not actionable from this project.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 110
target-version = "py311"
